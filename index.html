<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro Top Drilling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: escenario animado arriba, panel de decisiones debajo; estética de señalización de emergencia (amarillo seguridad + azul noche). Un solo look a propósito. */
:root{
  --night:#15203a;
  --night-2:#1f2d4f;
  --hazard:#ffc93c;
  --ink:#15203a;
  --card:#fbfaf6;
  --muted:#5b6a86;
  --safe:#1f9d74;
  --danger:#e23d3d;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--card)}
body{font-family:var(--body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4.5vw,2.3rem);margin:0;color:var(--hazard);text-wrap:balance;line-height:1.05}
.sub{margin:4px 0 0;color:#b9c4dc;font-size:.95rem}
.tools{display:flex;gap:10px;align-items:center}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--hazard);background:transparent}
.dot.ok{background:var(--safe);border-color:var(--safe)}
.dot.bad{background:var(--danger);border-color:var(--danger)}
.mini{font:700 .8rem var(--body);background:transparent;color:#b9c4dc;border:1.5px solid #3c4d75;border-radius:999px;padding:6px 12px;cursor:pointer}
.mini:focus-visible,.choice:focus-visible,.big:focus-visible{outline:3px solid var(--hazard);outline-offset:3px}

.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--night-2);
  border-top:10px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--ink) 14px 28px) 10;
  box-shadow:0 18px 40px rgba(0,0,0,.35)}
.stage svg{display:block;width:100%;height:auto}
.alert{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(.85rem,2.6vw,1.2rem);background:var(--danger);color:#fff;padding:6px 14px;border-radius:6px;letter-spacing:.04em;white-space:nowrap;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

.panel{background:var(--card);color:var(--ink);border-radius:14px;padding-block:18px 20px;padding-inline:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.1rem,3.2vw,1.5rem);margin:0;text-wrap:balance;line-height:1.15}
.panel p{margin:0;max-width:62ch;line-height:1.5;color:#2c3956}
.panel .tag{font:800 .75rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{font:800 1rem var(--body);text-align:left;display:flex;gap:10px;align-items:center;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.choice:hover{background:#fff4d1}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .k{font-family:var(--display);font-size:.95rem;background:var(--hazard);border-radius:6px;min-width:30px;height:30px;display:grid;place-items:center}
.big{align-self:flex-start;font:800 1.05rem var(--body);background:var(--hazard);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.result-bad h2{color:var(--danger)}
.result-good h2{color:var(--safe)}
.lessons{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.lessons li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.lessons b{font-family:var(--display);font-weight:400;background:var(--safe);color:#fff;border-radius:6px;min-width:28px;height:28px;display:grid;place-items:center;font-size:.85rem}
.wait{color:var(--muted);font-weight:700}

.score{font-family:var(--display);color:var(--hazard);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.alert.evac{background:var(--safe)}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nameRow{display:flex;flex-wrap:wrap;gap:10px}
.nameRow input{flex:1 1 220px;min-width:0;font:800 1.1rem var(--body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:12px 14px}
.nameRow input:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.err{color:var(--danger)!important;font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.trow{display:flex;align-items:center;gap:10px}
.timer{position:relative;flex:1;height:12px;border-radius:99px;background:#e6e2d6;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--safe);transition:background .2s,width .1s linear}
.timer i.low{background:var(--danger)}
.tnum{font-family:var(--display);font-size:1rem;min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:#efece3;border-radius:10px;padding:8px 14px;display:flex;flex-direction:column}
.stat span{font:800 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat strong{font-family:var(--display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums}
.npcIn{transform-box:fill-box;transform-origin:50% 100%}
.npcIn.panic{animation:panic .16s linear infinite}
@keyframes panic{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.npcIn.walk{animation:bob .28s ease-in-out infinite}
.bub{transform-box:fill-box;transform-origin:50% 100%}
h1{display:flex;align-items:center;gap:12px}
.badge{width:1.15em;height:1.05em;flex:none;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.chip{position:absolute;left:12px;bottom:12px;font:800 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;background:rgba(21,32,58,.82);color:var(--hazard);padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);transition:opacity .3s}
.panel{box-shadow:0 10px 30px rgba(0,0,0,.25)}
.panel > *{animation:rise .35s cubic-bezier(.2,.8,.3,1) both}
.panel > *:nth-child(2){animation-delay:.04s}.panel > *:nth-child(3){animation-delay:.08s}.panel > *:nth-child(4){animation-delay:.12s}.panel > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel .tag{align-self:flex-start;background:var(--ink);color:var(--hazard);padding:4px 10px;border-radius:999px}
.choice{transition:transform .12s ease,box-shadow .12s ease,background .15s}
.choice:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.cloud{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(260px)}}
#char,#rock{will-change:transform}
.npcIn{transition:transform .7s cubic-bezier(.5,0,.8,1)}
.npcIn.down{transform:rotate(-90deg)}
.npcIn.downR{transform:rotate(90deg)}
.brand{height:52px;width:auto;background:#fff;border-radius:10px;padding:4px 10px;order:-1}
header{align-items:center}
.winLogo{height:64px;width:auto;align-self:flex-start}
@media (max-width:600px){
  body{padding-block:10px 24px}
  .wrap{gap:10px}
  header{flex-wrap:wrap;gap:8px 10px}
  header > div:not(.tools){flex:1 1 0;min-width:0}
  .brand{height:46px;padding:2px 6px;border-radius:8px}
  h1{font-size:1.35rem;gap:8px}
  .sub{display:none}
  .tools{flex:1 1 100%;justify-content:space-between}
  .chip{display:none}
  .alert{font-size:.8rem;padding:4px 10px;top:8px}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
  .panel{padding-block:14px 16px;padding-inline:14px;gap:10px}
  .panel p{font-size:.95rem}
  .choice{padding:10px 12px;font-size:.95rem}
}
@media (min-width:900px){
  .wrap{max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,28vw,400px);gap:16px 20px;align-items:start}
  header{grid-column:1/-1}
  .stage{grid-column:1;max-width:calc((100vh - 150px)*800/450 + 20px);width:100%;justify-self:center}
  .panel{grid-column:2;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .panel p{font-size:.95rem}
  .choices{grid-template-columns:1fr}
  .stats{gap:8px}
}
.legL,.legR,.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
#stand.walking .legL,.npcIn.walk .legL{animation:swingL .44s ease-in-out infinite alternate}
#stand.walking .legR,.npcIn.walk .legR{animation:swingL .44s ease-in-out infinite alternate-reverse}
#stand.walking .armL,.npcIn.walk .armL{animation:swingA .44s ease-in-out infinite alternate-reverse}
#stand.walking .armR,.npcIn.walk .armR{animation:swingA .44s ease-in-out infinite alternate}
@keyframes swingL{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes swingA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes squash{0%{transform:scale(1.08,.86)}60%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
.squash{animation:squash .35s ease-out}
#stand,#crouch,.pst{transform-box:fill-box;transform-origin:50% 100%}
#books{transform-box:fill-box;transform-origin:50% 50%}
.npcIn.busy .armL{animation:swingA .3s ease-in-out infinite alternate}
.npcIn.busy .armR{animation:swingA .3s ease-in-out infinite alternate-reverse}
/* animaciones del escenario */
#world.shake{animation:shake .18s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-7px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,-2px)}100%{transform:translate(0,0)}}
#lamp{transform-box:view-box;transform-origin:330px 24px;animation:sway 3s ease-in-out infinite}
#world.shake #lamp{animation-duration:.7s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#world.shake #lamp{animation-name:swayBig}
@keyframes swayBig{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
#stand.walking{animation:bob .28s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#charBody{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s ease-in}
#charBody.hit{transform:rotate(-90deg)}
#fader{transition:opacity .7s}
@media (prefers-reduced-motion:reduce){
  #world.shake{animation-duration:.6s}
  #lamp,#stand.walking,.npcIn.panic,.npcIn.walk,.cloud,.badge,.panel > *,.legL,.legR,.armL,.armR,.squash{animation:none!important}
  .alert{animation:none}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>

const NS='http://www.w3.org/2000/svg';
const world=$('world'), ch=$('char'), body=$('charBody'), stand=$('stand'), crouch=$('crouch');
const rock=$('rock'), stars=$('stars'), panel=$('panel'), alertEl=$('alert'), fader=$('fader');
const SLOW=1.6;
const wait=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sonido ---------- */
function initAudio(){
  if(ac||!soundOn) return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5;}
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=140;
    rumbleGain=ac.createGain(); rumbleGain.gain.value=0;
    src.connect(lp).connect(rumbleGain).connect(ac.destination); src.start();
  }catch(e){ac=null}
}
function rumble(on){
  if(!ac||!rumbleGain) return;
  const t=ac.currentTime; rumbleGain.gain.cancelScheduledValues(t);
  rumbleGain.gain.linearRampToValueAtTime(on&&soundOn?0.9:0,t+(on?0.4:1.2));
}
function tone(f,dur,type='sine',vol=.25,delay=0,slide){
  if(!ac||!soundOn) return;
  try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}
}
const thud=()=>tone(120,.4,'sine',.8,0,40);
const pop=()=>tone(880,.08,'triangle',.12);
const tick=()=>tone(1200,.06,'square',.06);
const chime=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.35,'sine',.25,i*.13));
const sad=()=>[392,330,262].forEach((f,i)=>tone(f,.35,'triangle',.2,i*.2));
function siren(ms){
  if(!ac||!soundOn) return;
  try{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),t=ac.currentTime,e=t+ms/1000;
  o.type='square';o.frequency.value=720;l.frequency.value=1.4;lg.gain.value=200;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.045,t);g.gain.setValueAtTime(.045,e-.3);g.gain.linearRampToValueAtTime(0,e);
  o.connect(g).connect(ac.destination);o.start(t);l.start(t);o.stop(e);l.stop(e);}catch(e){}
}
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent='Sonido: '+(soundOn?'sí':'no');if(!soundOn)rumble(false);});

/* ---------- personas y globos ---------- */

  laptop:'<rect x="-21" y="-66" width="42" height="26" rx="3" fill="#3d4555"/><rect x="-17" y="-62" width="34" height="18" fill="#8fd3ff"/>',

function flashButton(){tone(1000,.1,'square',.08);$('elevBtn').animate([{fill:'#ffc93c'},{fill:'#ffffff'},{fill:'#ffc93c'}],{duration:400,iterations:2});}

function bubble(x,y,text,ms=2300,me=false){
  pop();
  let k=1;try{const sw=$('world').ownerSVGElement.getBoundingClientRect().width;if(sw)k=Math.min(2.1,Math.max(1,640/sw));}catch(e){}
  const w=Math.min(790,(Math.min(320,text.length*7.3+26))*k), cx=Math.max(w/2+6,Math.min(800-w/2-6,x));
  y=Math.max(36*k+6,y);
  const outer=el('g',{transform:`translate(${cx},${y})`},$('bubbles'));
  const inn=el('g',{class:'bub'},outer);
  const tx=Math.max(-w/2+16*k,Math.min(w/2-16*k,x-cx));
  el('path',{d:`M${tx-7} -6 L${tx} 9 L${tx+7} -6 Z`,fill:me?'#ffc93c':'#fff',stroke:'#15203a','stroke-width':2.5,'stroke-linejoin':'round'},inn);
  el('rect',{x:-w/2,y:-36*k,width:w,height:32*k,rx:14*k,fill:me?'#ffc93c':'#fff',stroke:'#15203a','stroke-width':2.5},inn);
  el('rect',{x:tx-6,y:-7,width:12,height:4,fill:me?'#ffc93c':'#fff'},inn);
  const t=el('text',{x:0,y:-15*k-(k-1)*4,'text-anchor':'middle','font-family':'Nunito, Arial','font-weight':800,'font-size':13.5*k,fill:'#15203a'},inn); t.textContent=text;
  if(!reduce)inn.animate([{transform:'scale(0)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
  setTimeout(()=>{const a=inn.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'});a.onfinish=()=>outer.remove();},ms*SLOW);
}

/* ---------- utilidades de escena ---------- */
function moveG(e,x,y,ms,ease='ease-in-out'){e.style.transition=`transform ${ms*SLOW}ms ${ease}, opacity .5s`;e.style.transform=`translate(${x}px,${y}px)`;}
function place(x,y){pos={x,y};ch.style.transition='none';ch.style.transform=`translate(${x}px,${y}px)`;}
async function walk(x,y=pos.y,speed=0.35){
  const dist=Math.hypot(x-pos.x,y-pos.y), ms=Math.max(250,dist/speed);
  stand.classList.add('walking');
  ch.style.transition=`transform ${ms*SLOW}ms cubic-bezier(.45,.05,.55,.95)`;
  ch.style.transform=`translate(${x}px,${y}px)`;
  pos={x,y}; await wait(ms); stand.classList.remove('walking');
}

  try{const w=$('tagTxt').getComputedTextLength()+20;$('tagBg').setAttribute('x',-w/2);$('tagBg').setAttribute('width',w);}catch(e){}

function current(){return ['office','stairs','outdoor'].find(s=>$(s).getAttribute('display')!=='none');}
function dust(on){
  clearInterval(dustInt); $('dim').setAttribute('opacity','0');
  if(!on) return;
  dustInt=setInterval(()=>{
    const sc=current(); if(sc!=='office'&&sc!=='stairs') return;
    if(sc==='office') $('dim').setAttribute('opacity',Math.random()<.25?'.3':'0');
    for(let i=0;i<2;i++){
      const big=Math.random()<.15;
      const d=big?el('rect',{x:Math.random()*780,y:20,width:8,height:6,fill:'#8a8178'},$('dust')):el('circle',{cx:Math.random()*800,cy:24,r:1.5+Math.random()*2.5,fill:'#b3a99e'},$('dust'));
      const a=d.animate([{transform:'translateY(0)'},{transform:`translate(${Math.random()*30-15}px,380px) rotate(${big?200:0}deg)`}],{duration:1100+Math.random()*700,easing:'cubic-bezier(.5,0,1,1)'});
      a.onfinish=()=>d.remove();
    }

}

function confetti(){
  if(reduce) return;
  const c=$('confetti'), r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cols=['#ffc93c','#1f9d74','#e23d3d','#3a6ea5','#ff7a1a','#9b5de5'];
  const ps=Array.from({length:160},()=>({x:Math.random()*r.width,y:-20-Math.random()*r.height*.6,vx:Math.random()*2-1,vy:2+Math.random()*3,s:5+Math.random()*6,a:Math.random()*6,c:cols[Math.random()*6|0]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,r.width,r.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(t-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,r.width,r.height);})(t0);
}

/* ---------- panel ---------- */
function render(html){panel.className='panel';panel.innerHTML=html;}
function stopTimer(){clearInterval(timerInt);timerInt=null;}
function ask(tg,title,text,options,step,secs=20){
  stopTimer();
  render(`<span class="tag">${tg}</span><h2>${title}</h2>${text?`<p>${text}</p>`:''}
    <div class="trow"><div class="timer"><i id="tbar"></i></div><span class="tnum" id="tnum">${secs}</span></div><div class="choices"></div>`);
  const box=panel.querySelector('.choices'), t0=performance.now();
  let lastSec=secs, done=false;
  timerInt=setInterval(()=>{
    const left=Math.max(0,secs-(performance.now()-t0)/1000), pct=left/secs*100, bar=$('tbar');
    if(!bar){stopTimer();return;}
    bar.style.width=pct+'%';bar.classList.toggle('low',pct<35);
    const sec=Math.ceil(left); $('tnum').textContent=sec;
    if(sec<lastSec&&sec<=3&&sec>0)tick(); lastSec=sec;
    if(left<=0&&!done){done=true;stopTimer();panel.innerHTML='<p class="wait">¡Se acabó el tiempo!</p>';timeout(step);}
  },100);
  const opts=options.slice();for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  if(opts.length>1&&opts[0].ok&&Math.random()<.67){opts.push(opts.shift());}
  opts.forEach((o,i)=>{
    const b=document.createElement('button');b.type='button';b.className='choice';b.id='opt'+i;
    b.innerHTML=`<span class="k">${'ABC'[i]}</span><span>${o.label}</span>`;
    b.addEventListener('click',()=>{
      if(done)return; done=true; stopTimer();
      const left=Math.max(0,secs-(performance.now()-t0)/1000);
      if(o.ok){score+=100+Math.round(left*5);setScore();}
      panel.innerHTML=`<p class="wait">…</p>`;o.go();
    });
    box.appendChild(b);
  });
  box.querySelector('button').focus({preventScroll:true});
}
async function timeout(step){
  if(step!==6){shake(true);await wait(400);await dropRock(pos.x);}
  lose(step,'Te quedaste paralizado.','En una emergencia no hay tiempo para dudar. Por eso se hacen los simulacros: para saber qué hacer sin pensarlo dos veces.');
}

/* ---------- flujo del juego ---------- */
function resetScene(){
  shake(false); stopTimer(); score=0; setScore();
  $('dots').innerHTML='';for(let i=0;i<TOTAL;i++){const d=document.createElement('span');d.className='dot';d.id='d'+i;$('dots').appendChild(d);}
  $('bubbles').innerHTML='';$('dust').innerHTML='';
  body.classList.remove('hit');setPose('stand');stars.setAttribute('display','none');
  rock.style.transition='none';rock.style.transform='translate(-200px,-100px)';
  $('books').getAnimations().forEach(a=>a.cancel());
  ['doorL','doorR'].forEach(d=>$(d).getAnimations().forEach(a=>a.cancel()));
  $('cracks').setAttribute('opacity','0');
  buildNpcs();
  holdMe(null);$('laptop').setAttribute('display','inline');$('laptop2').setAttribute('display','inline');
  $('glassLayer').innerHTML='';$('stretcher').setAttribute('display','none');ch.style.opacity='1';
  show('office');place(640,400);
}

/* escaleras */
const S={x0:110,y0:150,dx:40,dy:18,n:14};
function stepXY(i){return {x:S.x0+i*S.dx+20,y:S.y0+i*S.dy};}
(function buildStairs(){
  let d=`M${S.x0} ${S.y0}`, nose='', posts='';
  for(let i=0;i<S.n;i++){d+=` h${S.dx} v${S.dy}`; nose+=`M${S.x0+i*S.dx} ${S.y0+i*S.dy+1.5}h${S.dx-4}`;
    if(i%3===0){const x=S.x0+i*S.dx+20, y=S.y0+i*S.dy; posts+=`M${x} ${y}V${y-58}`;}}
  d+=` V450 H0 V${S.y0} Z`; $('stepsPath').setAttribute('d',d); $('nosePath').setAttribute('d',nose); $('postsPath').setAttribute('d',posts);
  $('railPath').setAttribute('d',`M${S.x0} ${S.y0-58} L${S.x0+S.dx*S.n} ${S.y0+S.dy*S.n-58}`);
})();
async function descend(from,to,floor,ms=120){
  $('floorTxt').textContent='PISO '+floor; $('floorBig').textContent=floor;
  stand.classList.add('walking');
  const p=stepXY(to), dur=(to-from+1)*ms;
  ch.style.transition=`transform ${dur*SLOW}ms linear`;ch.style.transform=`translate(${p.x}px,${p.y}px)`;pos=p;await wait(dur);
  stand.classList.remove('walking');
}
async function nextFlight(floor){
  ch.style.transition='opacity .18s';ch.style.opacity='0';await wait(180);
  place(stepXY(0).x,stepXY(0).y);$('floorTxt').textContent='PISO '+floor;$('floorBig').textContent=floor;
  ch.style.transition='opacity .18s';ch.style.opacity='1';await wait(180);
}

  N.brig.say('¡Luisa! ¡Regrese, todavía no he pasado lista!',2400);
  await wait(1500); N.c1.say('Uy… perdón, no sabía',1800);
  await N.c1.walkTo(705,1000);
  await wait(600);
  N.brig.say(`¿Está ${player}?`,2600);
  await wait(500);
  ask(tag(9),'El brigadista está pasando lista.','Luisa se quiso ir sin avisar y el brigadista la tuvo que llamar. ¿Qué haces tú?',[
    {label:'Levantar la mano y reportarme con el brigadista',ok:true,go:async()=>{
      dots(8,'ok'); meSay('¡Aquí estoy!',1500);
      await wait(1200); N.brig.say('¡Perfecto! ¡Lo hiciste muy bien!',2600);
      [N.c1,N.c2,N.brig].forEach(p=>p.jump());
      await wait(500); N.c2.say('¡Bravo!',1800);
      win();
    }},
    {label:'Irme para la casa sin avisar',go:async()=>{
      meSay('Yo me voy calladito…',1300);
      await walk(760,400,0.45); N.brig.say(`¿Dónde está ${player}?`,2400);
      await wait(900);
      lose(8,'Te fuiste sin reportarte.','Si no te reportas, los brigadistas creen que sigues adentro y entran a buscarte, arriesgando su vida. Siempre repórtate y espera instrucciones.');
    }}
  ],8);
}

reset(false);
})();
</script>
